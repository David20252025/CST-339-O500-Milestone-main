<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/layout :: head('Edit Product')"></head>

<body>
<div th:replace="fragments/layout :: navbar"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 mb-4 text-center">Edit Product</h1>

                    <form th:action="@{/products/update}" th:object="${productModel}" method="post" novalidate>

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input class="form-control" th:field="*{name}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" th:field="*{category}">
                                <option value="">Select Category</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Fitness Gear">Fitness Gear</option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input class="form-control" type="number" step="0.01" th:field="*{price}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity in Stock</label>
                            <input class="form-control" type="number" th:field="*{quantityInStock}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('quantityInStock')}" th:errors="*{quantityInStock}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Update Product</button>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
</body>
</html>
