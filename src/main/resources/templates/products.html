<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/layout :: head('Products')"></head>

<body>
<div th:replace="fragments/layout :: navbar"></div>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Product Catalog</h1>
            <p class="text-muted">Logged in as <span th:text="${session.loggedInUser}"></span></p>
        </div>

        <a class="btn btn-primary" th:href="@{/products/create}">Create Product</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
				<div class="card h-100 shadow-sm">
				    <div class="card-body d-flex flex-column">

				        <h5 class="card-title" th:text="${product.name}">Product Name</h5>

				        <p>
				            <span class="badge bg-secondary" th:text="${product.category}">Category</span>
				        </p>
				
                    <p>
                        <strong>Price:</strong>
                        $<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></span>
                    </p>
                    <p>
                        <strong>Stock:</strong>
                        <span th:text="${product.quantityInStock}"></span>
                    </p>
                    <p th:text="${product.description}">Description</p>

					<div class="mt-auto pt-3 d-flex gap-2">
					    <a class="btn btn-outline-primary btn-sm"
					       th:href="@{/products/details/{id}(id=${product.id})}">
					        View
					    </a>

						<a class="btn btn-outline-primary btn-sm"
						   th:href="@{/products/edit/{id}(id=${product.id})}">
						    Edit
					    </a>

					    <a class="btn btn-outline-danger btn-sm"
					       th:href="@{/products/delete/{id}(id=${product.id})}"
					       onclick="return confirm('Are you sure you want to delete this product?');">
					        Delete
					    </a>
						                </div>

						            </div>
						        </div>
						    </div>
						</div>

</main>

<div th:replace="fragments/layout :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
